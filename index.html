$('#ach').innerHTML=D.achievements.map(a=>`<div class="cr p3"><span class="lbl">${E(a.place)}</span><span>${E(a.title)}</span><span class="lbl">${E(a.sub)}</span></div>`).join('');
// contact
const links=[['Email',D.email,'mailto:'+D.email],['LinkedIn',D.linkedin,D.linkedin],['GitHub',D.github,D.github]].filter(l=>l[1]);
$('#cl').innerHTML=links.map(l=>`<a href="${E(l[2])}" ${l[0]==='Email'?'':'target="_blank" rel="noopener"'}>${l[0]}<span>${E(l[1].replace(/^https?:\/\/(www\.)?/,''))} ↗</span></a>`).join('');
// sections present
const SEC=[['about','About'],['projects','Projects'],['cad','CAD'],['experience','Experience'],['leadership','Leadership'],['skills','Skills'],['credentials','Training'],['achievements','Achievements'],['contact','Contact']];
const none={projects:!P.filter(p=>!p.cad).length,cad:!P.some(p=>p.cad),experience:!D.experience.length,leadership:!D.leadership.length,skills:!sk.length,credentials:!D.certs.length,achievements:!D.achievements.length};
SEC.forEach(s=>{if(none[s[0]])$('#'+s[0]).remove()});const live=SEC.filter(s=>!none[s[0]]);
$('#links').innerHTML=live.map(s=>`<a href="#${s[0]}">${s[1]}</a>`).join('');
$('#links').onclick=e=>{if(e.target.tagName==='A'){$('#links').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}};
$('#menu').onclick=()=>{const o=$('#links').classList.toggle('open');$('#menu').setAttribute('aria-expanded',o)};
// form with loading / success / error
const st=(m,c)=>{const s=$('#st');s.textContent=m;s.className=c||''};
$('#cf').onsubmit=e=>{e.preventDefault();const n=$('#fn').value.trim(),m=$('#fe').value.trim(),b=$('#fm').value.trim();
 if(!n||!/^\S+@\S+\.\S+$/.test(m)||!b)return st('Please enter your name, a valid email address and a message.','err');
 if(!D.email)return st('The recipient email address has not been set up yet, so this message cannot be sent.','err');
 $('#send').disabled=true;st('Preparing your message…');
 setTimeout(()=>{location.href=`mailto:${D.email}?subject=${encodeURIComponent('Portfolio enquiry from '+n)}&body=${encodeURIComponent(b+'\n\n'+n+' ('+m+')')}`;$('#send').disabled=false;st('Your email app should now open with the message ready to send.','ok')},500)};
// resume (built from page content when no PDF is set)
$('#resume').innerHTML=`<h1>${E(D.name)}</h1><div>${E(D.title)}${D.email?' · '+E(D.email):''}${D.linkedin?' · '+E(D.linkedin):''}</div><h2>Education</h2><p><b>${E(D.program)}</b>, ${E(D.university)} (${E(D.period)})</p><h2>Experience</h2>${D.experience.map(x=>`<p><b>${E(x.role)}</b>, ${E(x.org)} (${E(x.period)})</p><p>${E(x.summary)}</p>${ul(x.areas.map(a=>a[0]))}`).join('')}<h2>Leadership</h2>${D.leadership.map(l=>`<p><b>${E(l.role)}</b>, ${E(l.org)} (${E(l.when)})</p>`).join('')}<h2>Skills</h2>${sk.map(s=>`<p><b>${E(s.cat)}:</b> ${E(s.items.join(', '))}</p>`).join('')}`;
document.addEventListener('click',e=>{if(e.target.closest('[data-print]'))window.print()});
// theme 
const root=document.documentElement,sun='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4 12H2m20 0h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',moon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>';
const dark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,paint=()=>$('#theme').innerHTML=dark()?sun:moon;
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}paint();
$('#theme').onclick=()=>{const t=dark()?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}paint()};
// scroll behaviour
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
live.forEach(s=>so.observe($('#'+s[0])));
addEventListener('scroll',()=>$('#top').classList.toggle('show',scrollY>600),{passive:true});
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
